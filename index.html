<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acortador - mercyanime</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        body {max-width:600px;margin:80px auto;padding:20px;text-align:center;}
        h1 {color:#24292e;margin-bottom:30px;}
        input {width:100%;padding:12px 15px;font-size:16px;border:1px solid #e1e4e8;border-radius:6px;margin-bottom:15px;}
        button {padding:12px 25px;background:#2ea44f;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
        button:hover {background:#2c974b;}
        .resultado {margin-top:25px;padding:15px;background:#f6f8fa;border-radius:6px;display:none;}
        .enlace-corto {color:#0366d6;font-weight:bold;font-size:18px;text-decoration:none;}
        .cargando {display:none;color:#586069;margin:15px 0;}
    </style>
</head>
<body>
    <h1>🔗 Acortador mercyanime</h1>
    <input type="url" id="enlaceLargo" placeholder="Pega tu enlace aquí..." required>
    <button id="btnAcortar">Acortar Enlace</button>
    <div class="cargando" id="cargando">Guardando... ⏳</div>

    <div class="resultado" id="cajaResultado">
        <p>Enlace creado:</p>
        <a class="enlace-corto" id="enlaceCorto" href="" target="_blank"></a>
    </div>

    <script>
        // ✅ TUS DATOS YA CONFIGURADOS
        const TU_USUARIO = "mercyanime";
        const TU_REPOSITORIO = "go";
        const TU_TOKEN = "ghp_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"; // <-- PON AQUÍ TU TOKEN

        const DOMINIO = `https://${TU_USUARIO}.github.io/${TU_REPOSITORIO}/`;

        // Generar código aleatorio
        function generarCodigo() {
            const c = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let codigo = "";
            for(let i=0;i<5;i++) codigo += c[Math.floor(Math.random()*c.length)];
            return codigo;
        }

        // Obtener enlaces guardados
        async function obtenerEnlaces() {
            try {
                const res = await fetch(`https://api.github.com/repos/${TU_USUARIO}/${TU_REPOSITORIO}/contents/enlaces.json`, {
                    headers: {
                        Authorization: `token ${TU_TOKEN}`,
                        Accept: "application/vnd.github.v3+json"
                    }
                });
                if(res.status === 404) {
                    // 📌 AQUÍ YA DEJO GUARDADO TU ENLACE DE HOUSE GAMING
                    return {
                        contenido: {
                            "housegaming": "https://sites.google.com/view/housegamingpuyoec/p%C3%A1gina-principal"
                        },
                        sha: ""
                    };
                }
                const datos = await res.json();
                return {
                    contenido: JSON.parse(atob(datos.content)),
                    sha: datos.sha
                };
            } catch(e) {
                alert("Error al leer: " + e);
                return {};
            }
        }

        // Guardar nuevo enlace
        async function guardarEnlace(codigo, url) {
            document.getElementById("cargando").style.display = "block";
            const actual = await obtenerEnlaces();
            const enlaces = actual.contenido || {};
            enlaces[codigo] = url;

            const contenido = btoa(JSON.stringify(enlaces, null, 2));

            try {
                await fetch(`https://api.github.com/repos/${TU_USUARIO}/${TU_REPOSITORIO}/contents/enlaces.json`, {
                    method: "PUT",
                    headers: {
                        Authorization: `token ${TU_TOKEN}`,
                        Accept: "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify({
                        message: "Agregado enlace",
                        content: contenido,
                        sha: actual.sha || ""
                    })
                });
                const final = DOMINIO + codigo;
                document.getElementById("enlaceCorto").href = final;
                document.getElementById("enlaceCorto").textContent = final;
                document.getElementById("cajaResultado").style.display = "block";
            } catch(e) {
                alert("Revisa que el TOKEN esté bien puesto ❌");
            } finally {
                document.getElementById("cargando").style.display = "none";
            }
        }

        document.getElementById("btnAcortar").addEventListener("click", ()=>{
            const url = document.getElementById("enlaceLargo").value.trim();
            if(!url) return alert("Pon un enlace válido");
            guardarEnlace(generarCodigo(), url);
        });
    </script>
</body>
</html>
