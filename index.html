<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acortador de Enlaces</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #24292e;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        button {
            padding: 12px 25px;
            background-color: #2ea44f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2c974b;
        }
        .resultado {
            margin-top: 25px;
            padding: 15px;
            background-color: #f6f8fa;
            border-radius: 6px;
            display: none;
        }
        .enlace-corto {
            color: #0366d6;
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
        }
        .cargando {
            display: none;
            color: #586069;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <h1>🔗 Acortador de Enlaces</h1>
    <input type="url" id="enlaceLargo" placeholder="Pega tu enlace aquí (ej: https://ejemplo.com)" required>
    <button id="btnAcortar">Acortar Enlace</button>
    <div class="cargando" id="cargando">Guardando enlace... ⏳</div>

    <div class="resultado" id="cajaResultado">
        <p>Enlace corto generado:</p>
        <a class="enlace-corto" id="enlaceCorto" href="" target="_blank"></a>
    </div>

    <script>
        // 👇 CAMBIA ESTOS 2 DATOS SOLAMENTE 👇
        const TU_USUARIO = "TU_USUARIO_GITHUB";  // Pon aquí tu usuario real
        const TU_TOKEN = "ghp_XXXXXXXXXXXXXXXX";  // Pon aquí tu token
        // 👆 YA CONFIGURAMOS TU REPOSITORIO: "go" 👆

        const TU_REPOSITORIO = "go";
        const DOMINIO = `https://${TU_USUARIO}.github.io/${TU_REPOSITORIO}/`;

        // Generar código corto aleatorio
        function generarCodigo() {
            const caracteres = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let codigo = "";
            for (let i = 0; i < 5; i++) {
                codigo += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            return codigo;
        }

        // Obtener la lista de enlaces guardada en GitHub
        async function obtenerEnlaces() {
            try {
                const respuesta = await fetch(
                    `https://api.github.com/repos/${TU_USUARIO}/${TU_REPOSITORIO}/contents/enlaces.json`,
                    {
                        headers: {
                            "Authorization": `token ${TU_TOKEN}`,
                            "Accept": "application/vnd.github.v3+json"
                        }
                    }
                );
                if (respuesta.status === 404) return {}; // Si el archivo no existe aún, empieza vacío
                const datos = await respuesta.json();
                const contenido = JSON.parse(atob(datos.content)); // Decodifica el texto
                return { contenido, sha: datos.sha };
            } catch (error) {
                console.error("Error:", error);
                return {};
            }
        }

        // Guardar NUEVO enlace en tu repositorio
        async function guardarEnlace(codigo, enlaceLargo) {
            document.getElementById("cargando").style.display = "block";
            const datosActuales = await obtenerEnlaces();
            const enlaces = datosActuales.contenido || {};
            const shaActual = datosActuales.sha || "";

            enlaces[codigo] = enlaceLargo; // Agregamos el nuevo

            // Convertimos texto a formato que acepta GitHub
            const contenidoCodificado = btoa(JSON.stringify(enlaces, null, 2));

            try {
                await fetch(
                    `https://api.github.com/repos/${TU_USUARIO}/${TU_REPOSITORIO}/contents/enlaces.json`,
                    {
                        method: "PUT",
                        headers: {
                            "Authorization": `token ${TU_TOKEN}`,
                            "Accept": "application/vnd.github.v3+json"
                        },
                        body: JSON.stringify({
                            message: "Nuevo enlace agregado",
                            content: contenidoCodificado,
                            sha: shaActual
                        })
                    }
                );
                // Mostrar el resultado
                const enlaceFinal = DOMINIO + codigo;
                document.getElementById("enlaceCorto").href = enlaceFinal;
                document.getElementById("enlaceCorto").textContent = enlaceFinal;
                document.getElementById("cajaResultado").style.display = "block";
            } catch (error) {
                alert("Error: Revisa tu usuario o token");
            } finally {
                document.getElementById("cargando").style.display = "none";
            }
        }

        // Acción al presionar el botón
        document.getElementById("btnAcortar").addEventListener("click", () => {
            const enlaceLargo = document.getElementById("enlaceLargo").value.trim();
            if (!enlaceLargo) return alert("Pon un enlace válido");
            const codigo = generarCodigo();
            guardarEnlace(codigo, enlaceLargo);
        });
    </script>

</body>
</html>
