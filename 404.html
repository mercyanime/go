<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo...</title>
    <script>
        // ✅ TUS DATOS YA CONFIGURADOS
        const TU_USUARIO = "mercyanime";
        const TU_REPOSITORIO = "go";

        // Sacar el código de la dirección
        const partes = window.location.pathname.split('/');
        const codigo = partes[partes.length - 1];

        async function redirigir() {
            if(!codigo || codigo === "index.html") {
                document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>🔗 Acortador activo</h2>";
                return;
            }

            try {
                // Leer el archivo con todos los enlaces
                const res = await fetch(`https://api.github.com/repos/${TU_USUARIO}/${TU_REPOSITORIO}/contents/enlaces.json`);
                if(!res.ok) throw new Error();

                const datos = await res.json();
                const enlaces = JSON.parse(atob(datos.content));

                // Si existe, manda directo
                if(enlaces[codigo]) {
                    window.location.href = enlaces[codigo];
                } else {
                    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>❌ Enlace no existe</h2>";
                }
            } catch(e) {
                document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>❌ Error al cargar datos</h2>";
            }
        }

        redirigir();
    </script>
</head>
<body></body>
</html>
